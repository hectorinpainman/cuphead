<!DOCTYPE html>
<html lang="en-us">
  <head>
    <base href="https://cdn.jsdelivr.net/gh/web-ports/cuphead@c9ff1b6b16f9d402b78a42fc2200e1c076c0ab6e/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Cuphead</title>
    <style>
      body {
        background-color: black;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      #gameContainer {
        width: 100vw !important;
        height: 100vh !important;
      }
      canvas {
        width: 100% !important;
        height: 100% !important;
      }

      /* ---------- Loading overlay ---------- */
      #loading-overlay {
        position: fixed;
        top: 0; left: 0; right: 0;
        z-index: 10;
        padding: 20px 5vw 0;
        pointer-events: none;
      }
      #loading-text {
        font-weight: bold;
        font-size: 48px;
        font-family: cursive;
        text-align: center;
        color: white;
        background: linear-gradient(
          270deg,
          #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8f00ff
        );
        background-size: 400% 400%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: rainbow 3s ease infinite;
      }
      @keyframes rainbow {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      #progress-wrap {
        margin: 18px auto 0;
        max-width: 900px;
      }
      #progress-track {
        height: 26px;
        border: 2px solid #fff;
        border-radius: 14px;
        background: #111;
        overflow: hidden;
        position: relative;
      }
      #progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #8f00ff);
        background-size: 900px 100%;
        transition: width 0.15s linear;
      }
      #progress-pct {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font: bold 14px monospace;
        color: #fff;
        text-shadow: 0 0 3px #000, 0 0 3px #000, 0 0 3px #000;
      }
      #progress-info {
        margin-top: 10px;
        text-align: center;
        font: 15px/1.5 monospace;
        color: #ddd;
      }
      #progress-parts { color: #7CFC00; }
      #progress-error { color: #ff5555; font-weight: bold; }

      /* ---------- Debug terminal ---------- */
      #debug-terminal {
        position: fixed;
        left: 0; right: 0; bottom: 0;
        height: 30vh;
        z-index: 20;
        display: none;
        flex-direction: column;
        background: rgba(0, 0, 0, 0.85);
        border-top: 2px solid #00ff66;
        font: 12px/1.4 Consolas, "Courier New", monospace;
        color: #00ff66;
      }
      #debug-terminal.visible { display: flex; }
      #debug-header {
        display: flex;
        justify-content: space-between;
        padding: 3px 10px;
        background: #003a1a;
        color: #aaffcc;
        flex: 0 0 auto;
      }
      #debug-log {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 6px 10px;
        white-space: pre-wrap;
        word-break: break-all;
      }
      #debug-log .warn { color: #ffcc00; }
      #debug-log .err { color: #ff5555; }
      #debug-log .info { color: #66ccff; }
      #debug-log .time { color: #558866; }
      /* While the game is running, let clicks pass through to the game */
      #debug-terminal.ingame { pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="loading-overlay">
      <div id="loading-text">LOADING...</div>
      <div id="progress-wrap">
        <div id="progress-track">
          <div id="progress-fill"></div>
          <div id="progress-pct">0%</div>
        </div>
        <div id="progress-info">
          <div id="progress-size">0.00 MB / 2101.31 MB</div>
          <div id="progress-parts">Waiting for downloads...</div>
          <div id="progress-error"></div>
        </div>
      </div>
    </div>

    <div id="gameContainer"></div>

    <div id="debug-terminal">
      <div id="debug-header">
        <span>DEBUG TERMINAL</span>
        <span>type "debug" to toggle</span>
      </div>
      <div id="debug-log"></div>
    </div>

    <script src="Build/UnityLoader.js"></script>
    <script>
    /* =====================================================
       Debug terminal
       ===================================================== */
    const terminal = document.getElementById("debug-terminal");
    const logBox = document.getElementById("debug-log");
    const MAX_LINES = 500;
    let debugForced = false;   // set when the player types "debug"
    let gameRunning = false;

    function ts() {
      const d = new Date();
      return d.toTimeString().slice(0, 8) + "." + String(d.getMilliseconds()).padStart(3, "0");
    }

    function termLog(msg, cls) {
      const line = document.createElement("div");
      if (cls) line.className = cls;
      const t = document.createElement("span");
      t.className = "time";
      t.textContent = "[" + ts() + "] ";
      line.appendChild(t);
      line.appendChild(document.createTextNode(String(msg)));
      logBox.appendChild(line);
      while (logBox.childNodes.length > MAX_LINES) logBox.removeChild(logBox.firstChild);
      logBox.scrollTop = logBox.scrollHeight;
    }

    function updateTerminalVisibility() {
      const show = !gameRunning || debugForced;
      terminal.classList.toggle("visible", show);
      terminal.classList.toggle("ingame", gameRunning);
      if (show) logBox.scrollTop = logBox.scrollHeight;
    }

    // Mirror browser console + errors into the terminal
    ["log", "info", "warn", "error"].forEach(function (level) {
      const original = console[level];
      console[level] = function () {
        try {
          const text = Array.prototype.map.call(arguments, function (a) {
            if (typeof a === "string") return a;
            try { return JSON.stringify(a); } catch (e) { return String(a); }
          }).join(" ");
          termLog(text, level === "error" ? "err" : level === "warn" ? "warn" : "");
        } catch (e) {}
        original.apply(console, arguments);
      };
    });
    window.addEventListener("error", function (e) {
      termLog("Uncaught: " + e.message + (e.filename ? " (" + e.filename + ":" + e.lineno + ")" : ""), "err");
    });
    window.addEventListener("unhandledrejection", function (e) {
      termLog("Unhandled promise rejection: " + (e.reason && e.reason.message ? e.reason.message : e.reason), "err");
    });

    // Type "debug" anywhere (including in-game) to toggle the terminal
    let keyBuffer = "";
    window.addEventListener("keydown", function (e) {
      if (e.ctrlKey || e.altKey || e.metaKey || !e.key || e.key.length !== 1) return;
      keyBuffer = (keyBuffer + e.key.toLowerCase()).slice(-5);
      if (keyBuffer === "debug") {
        keyBuffer = "";
        debugForced = !debugForced;
        termLog("Debug terminal " + (debugForced ? "forced ON" : "forced OFF"), "info");
        updateTerminalVisibility();
      }
    }, true);

    updateTerminalVisibility();
    termLog("Debug terminal ready. Loader started.", "info");

    /* =====================================================
       Loading UI
       ===================================================== */
    const loadingOverlay = document.getElementById("loading-overlay");
    const loadingText = document.getElementById("loading-text");
    const fillEl = document.getElementById("progress-fill");
    const pctEl = document.getElementById("progress-pct");
    const sizeEl = document.getElementById("progress-size");
    const partsEl = document.getElementById("progress-parts");
    const errorEl = document.getElementById("progress-error");

    const TOTAL_MB = 2101.31;
    const TOTAL_BYTES = TOTAL_MB * 1024 * 1024;

    // Every file that gets downloaded in parts
    const groups = [
      { id: "data", file: "Build/CupheadPort.data.unityweb",      start: 1, end: 103 },
      { id: "wasm", file: "Build/CupheadPort.wasm.code.unityweb", start: 1, end: 2 },
      { id: "asm",  file: "Build/CupheadPort.asm.code.unityweb",  start: 1, end: 3 }
    ];
    const state = {};
    let totalParts = 0;
    groups.forEach(function (g) {
      const count = g.end - g.start + 1;
      totalParts += count;
      state[g.id] = { total: count, done: 0, active: new Set(), cached: false };
    });

    let loadedBytes = 0;
    let doneParts = 0;
    let uiQueued = false;
    let phase = "download"; // "download" -> "init"

    function fmtMB(b) { return (b / (1024 * 1024)).toFixed(2); }

    function renderUI() {
      uiQueued = false;
      if (phase === "download") {
        const pct = Math.min(100, (loadedBytes / TOTAL_BYTES) * 100);
        fillEl.style.width = pct.toFixed(2) + "%";
        pctEl.textContent = pct.toFixed(1) + "%";
        loadingText.textContent = "LOADING...";
        sizeEl.textContent = fmtMB(loadedBytes) + " MB / " + TOTAL_MB.toFixed(2) + " MB";

        const bits = groups.map(function (g) {
          const s = state[g.id];
          if (s.cached) return g.id + ": cached";
          if (s.done >= s.total) return g.id + ": " + s.total + "/" + s.total + " \u2713";
          // lowest-numbered part still downloading = "current" part
          let cur = s.active.size ? Math.min.apply(null, Array.from(s.active)) : s.done + 1;
          return g.id + ": part " + cur + "/" + s.total + (s.active.size > 1 ? " (+" + (s.active.size - 1) + " active)" : "");
        });
        partsEl.textContent = "Parts done " + doneParts + "/" + totalParts + "  |  " + bits.join("  |  ");
      }
    }
    function queueUI() {
      if (!uiQueued) { uiQueued = true; requestAnimationFrame(renderUI); }
    }

    /* =====================================================
       Downloading
       ===================================================== */
    async function fetchWithProgress(url, groupId, partNo) {
      const label = groupId + " part " + partNo;
      const s = state[groupId];
      s.active.add(partNo);
      termLog("START  " + label + "  <- " + url);
      queueUI();

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error("HTTP " + response.status + " for " + url);
        const reader = response.body.getReader();
        const chunks = [];
        let received = 0;
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          received += value.length;
          loadedBytes += value.length;
          chunks.push(value);
          queueUI();
        }
        const fullBuffer = new Uint8Array(received);
        let offset = 0;
        for (const chunk of chunks) {
          fullBuffer.set(chunk, offset);
          offset += chunk.length;
        }
        s.active.delete(partNo);
        s.done++;
        doneParts++;
        termLog("DONE   " + label + "  (" + fmtMB(received) + " MB)  [" + doneParts + "/" + totalParts + "]");
        queueUI();
        return fullBuffer.buffer;
      } catch (err) {
        termLog("FAILED " + label + ": " + err.message, "err");
        errorEl.textContent = "Failed on " + label + ": " + err.message;
        throw err;
      }
    }

    async function mergeFiles(group) {
      const cacheKey = group.file.split("/").pop();
      let cache = null;
      try {
        cache = await caches.open("cuphead-cache");
        const cachedResponse = await cache.match(cacheKey);
        if (cachedResponse) {
          const blob = await cachedResponse.blob();
          const s = state[group.id];
          s.cached = true;
          s.done = s.total;
          doneParts += s.total;
          loadedBytes += blob.size;
          termLog("CACHE  " + group.id + " loaded from cache (" + fmtMB(blob.size) + " MB)", "info");
          queueUI();
          return URL.createObjectURL(blob);
        }
      } catch (e) {
        termLog("Cache API unavailable: " + e.message, "warn");
      }

      const parts = [];
      for (let i = group.start; i <= group.end; i++) {
        parts.push({ url: group.file + ".part" + i, n: i });
      }
      const buffers = await Promise.all(
        parts.map(function (p) { return fetchWithProgress(p.url, group.id, p.n); })
      );
      const mergedBlob = new Blob(buffers);
      termLog("MERGED " + group.id + " -> " + fmtMB(mergedBlob.size) + " MB", "info");
      if (cache) {
        try {
          await cache.put(cacheKey, new Response(mergedBlob));
          termLog("CACHED " + group.id + " saved to browser cache", "info");
        } catch (e) {
          termLog("Could not cache " + group.id + ": " + e.message, "warn");
        }
      }
      return URL.createObjectURL(mergedBlob);
    }

    /* =====================================================
       Boot
       ===================================================== */
    function onGameReady() {
      gameRunning = true;
      loadingOverlay.remove();
      termLog("Game started. Type \"debug\" to toggle this terminal.", "info");
      updateTerminalVisibility();
    }

    (async () => {
      try {
        const [dataUrl, wasmUrl, asmUrl] = await Promise.all(groups.map(mergeFiles));
        termLog("All parts downloaded (" + fmtMB(loadedBytes) + " MB).", "info");

        const originalOpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function (method, url, ...rest) {
          if (url.includes("CupheadPort.data.unityweb")) {
            url = dataUrl;
          } else if (url.includes("CupheadPort.wasm.code.unityweb")) {
            url = wasmUrl;
          } else if (url.includes("CupheadPort.asm.code.unityweb")) {
            url = asmUrl;
          }
          return originalOpen.call(this, method, url, ...rest);
        };

        // Switch the UI to the Unity initialisation phase
        phase = "init";
        fillEl.style.width = "100%";
        pctEl.textContent = "100%";
        loadingText.textContent = "STARTING GAME...";
        sizeEl.textContent = "Unpacking and initialising Unity";
        partsEl.textContent = "Parts done " + totalParts + "/" + totalParts;
        termLog("Instantiating Unity player...", "info");

        let readyCalled = false;
        UnityLoader.instantiate("gameContainer", "Build/CupheadPort.json", {
          onProgress: function (instance, progress) {
            if (typeof progress === "number") {
              sizeEl.textContent = "Initialising Unity: " + Math.round(progress * 100) + "%";
              if (progress >= 1 && !readyCalled) {
                readyCalled = true;
                termLog("Unity reported progress 100%.", "info");
                onGameReady();
              }
            }
          }
        });

        // Fallback in case onProgress never reports completion
        const poll = setInterval(function () {
          if (readyCalled) { clearInterval(poll); return; }
          const canvas = document.querySelector("#gameContainer canvas");
          if (canvas && canvas.width > 0) {
            readyCalled = true;
            clearInterval(poll);
            termLog("Canvas detected, treating game as ready.", "info");
            onGameReady();
          }
        }, 1000);
      } catch (err) {
        loadingText.textContent = "LOAD FAILED";
        termLog("Fatal loading error: " + err.message, "err");
      }
    })();
    </script>
  </body>
</html>
